<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - Clientes</title>
    <link rel="stylesheet" href="css/styles.css?v=14">
</head>
<body>
    <nav id="menu" class="menu-superior"></nav>
    <div class="container-full">
        <header>
            <h1>CRM - GESTIÓN DE CLIENTES</h1>
            <div class="crm-acciones">
                <button id="crm-nuevo" class="filtro-btn crm-btn-primary">+ NUEVO REGISTRO</button>
                <button id="crm-export" class="filtro-btn">EXPORTAR CSV</button>
                <button id="crm-import-btn" class="filtro-btn">IMPORTAR CSV</button>
                <input type="file" id="crm-import-file" accept=".csv" style="display:none">
            </div>
        </header>

        <div id="crm-resumen" class="crm-resumen"></div>

        <div class="crm-filtros">
            <div class="crm-multi-wrap">
                <button id="filtro-region-btn" class="filtro-btn">REGIONES <span id="filtro-region-badge" class="crm-fechas-badge" style="display:none"></span></button>
                <div id="filtro-region-popup" class="crm-multi-popup" style="display:none"></div>
            </div>
            <div class="crm-multi-wrap">
                <button id="filtro-cliente-btn" class="filtro-btn">CLIENTES <span id="filtro-cliente-badge" class="crm-fechas-badge" style="display:none"></span></button>
                <div id="filtro-cliente-popup" class="crm-multi-popup" style="display:none"></div>
            </div>
            <select id="filtro-estado"><option value="">TODOS LOS ESTADOS</option></select>
            <div class="crm-fechas-wrap">
                <button id="crm-fechas-btn" class="filtro-btn">FECHAS <span id="crm-fechas-badge" class="crm-fechas-badge" style="display:none"></span></button>
                <div id="crm-fechas-popup" class="crm-fechas-popup" style="display:none">
                    <div class="crm-rango">
                        <span class="crm-rango-nombre">F. Est. Cierre</span>
                        <div class="crm-rango-campos">
                            <input type="date" id="filtro-fe-desde"><span class="crm-rango-sep">→</span><input type="date" id="filtro-fe-hasta">
                        </div>
                    </div>
                    <div class="crm-rango">
                        <span class="crm-rango-nombre">F. Registro</span>
                        <div class="crm-rango-campos">
                            <input type="date" id="filtro-fr-desde"><span class="crm-rango-sep">→</span><input type="date" id="filtro-fr-hasta">
                        </div>
                    </div>
                    <div class="crm-rango">
                        <span class="crm-rango-nombre">F. Últ. Estado</span>
                        <div class="crm-rango-campos">
                            <input type="date" id="filtro-fs-desde"><span class="crm-rango-sep">→</span><input type="date" id="filtro-fs-hasta">
                        </div>
                    </div>
                    <div class="crm-fechas-acciones">
                        <button id="crm-fechas-limpiar" class="filtro-btn">LIMPIAR</button>
                    </div>
                </div>
            </div>
        </div>

        <main class="calendario">
            <div class="crm-tabla-wrap">
                <table id="crm-tabla" class="crm-tabla">
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Región</th>
                            <th>Línea</th>
                            <th>SKU</th>
                            <th>Unidades</th>
                            <th>Promo</th>
                            <th>P. Cliente</th>
                            <th class="crm-col-total">P. Cliente Total</th>
                            <th>P. Intcomex</th>
                            <th class="crm-col-total">Total</th>
                            <th>Ship &amp; Debit</th>
                            <th># Order</th>
                            <th>Estado</th>
                            <th>Obs.</th>
                            <th></th>
                            <th>F. Est. Cierre</th>
                            <th>F. Registro</th>
                            <th>F. Últ. Estado</th>
                        </tr>
                    </thead>
                    <tbody id="crm-tbody"></tbody>
                    <tfoot id="crm-tfoot"></tfoot>
                </table>
                <div id="crm-vacio" class="sin-feriados" style="display:none">No hay registros.</div>
            </div>
        </main>
    </div>

    <div class="crm-bell-wrap">
        <button id="crm-bell" class="crm-bell" title="Notificaciones del calendario">&#128276; <span id="crm-bell-badge" class="crm-fechas-badge" style="display:none"></span></button>
        <div id="crm-bell-popup" class="crm-bell-popup" style="display:none">
            <div class="crm-bell-titulo">NOTAS DEL CALENDARIO</div>
            <div id="crm-bell-list" class="crm-bell-list"></div>
        </div>
    </div>

    <div id="crm-obs-popup" class="crm-obs-popup" style="display:none">
        <div class="crm-obs-popup-box">
            <div class="nota-panel-header">
                <span id="crm-obs-titulo" class="nota-fecha"></span>
                <button id="crm-obs-cerrar" class="filtro-btn">✕</button>
            </div>
            <div id="crm-obs-texto" class="crm-obs-texto"></div>
        </div>
    </div>


    <div id="crm-modal" class="crm-modal" style="display:none">
        <div class="crm-modal-box">
            <h2 id="crm-modal-titulo">NUEVO REGISTRO</h2>
            <form id="crm-form">
                <div class="crm-form-grid">
                    <label>Cliente (Canal)
                        <input type="text" id="f-canal" required list="lista-canales">
                        <datalist id="lista-canales"></datalist>
                    </label>
                    <label>Región
                        <input type="text" id="f-region" list="lista-regiones">
                        <datalist id="lista-regiones"></datalist>
                    </label>
                    <label>Línea
                        <input type="text" id="f-linea" list="lista-lineas">
                        <datalist id="lista-lineas"></datalist>
                    </label>
                    <label>SKU
                        <input type="text" id="f-sku" list="lista-skus">
                        <datalist id="lista-skus"></datalist>
                    </label>
                    <label>Unidades
                        <input type="number" id="f-unidades" min="0" step="1" value="0">
                    </label>
                    <label>Promo (forecast)
                        <input type="text" id="f-promo">
                    </label>
                    <label>SKU Promo
                        <input type="text" id="f-skuPromo">
                    </label>
                    <label>Precio Cliente
                        <input type="number" id="f-precioCliente" min="0" step="0.01" value="0">
                    </label>
                    <label>Precio Intcomex
                        <input type="number" id="f-precioIntcomex" min="0" step="0.01" value="0">
                    </label>
                    <label># Order (alfanumérico, 12 car. máx.)
                        <input type="text" id="f-order" maxlength="12" placeholder="ABC123456789">
                    </label>
                    <label>Fecha Estimada Cierre
                        <input type="date" id="f-fecha">
                    </label>
                    <label>Estado
                        <select id="f-estado"></select>
                    </label>
                    <label>Total (automático)
                        <input type="text" id="f-total" readonly>
                    </label>
                    <label>Fecha de Registro (automático)
                        <input type="text" id="f-fechaRegistro" readonly>
                    </label>
                    <label>Fecha de Último Estado (automático)
                        <input type="text" id="f-fechaEstado" readonly>
                    </label>
                </div>
                <label>Ship and Debit
                    <textarea id="f-ship" rows="3" maxlength="80" placeholder="12345, 67890, ..."></textarea>
                </label>
                <label>Observaciones
                    <textarea id="f-obs" rows="4"></textarea>
                </label>
                <div class="crm-modal-acciones">
                    <button type="button" id="crm-cancelar" class="filtro-btn">CANCELAR</button>
                    <button type="submit" class="filtro-btn crm-btn-primary">GUARDAR</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/crm.js?v=14"></script>
    <script src="js/nav.js?v=14"></script>
</body>
</html>
