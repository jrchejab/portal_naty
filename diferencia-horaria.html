<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diferencia Horaria vs Colombia 2026</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="hora-container">
        <h1>DIFERENCIA HORARIA vs COLOMBIA</h1>
        <p class="hora-sub">Referencia: Colombia (UTC-5) · Zonas horarias: TimeZoneDB (CC BY 3.0)</p>
        <div class="hora-volver">
            <a class="nav-link" href="index.html">&#9664; VOLVER AL CALENDARIO</a>
        </div>
        <div class="hora-grid">
            <div class="hora-tabla">
                <h2>HORA ACTUAL (EN VIVO)</h2>
                <table>
                    <thead>
                        <tr>
                            <th>País</th>
                            <th>Hora local</th>
                            <th>Dif.</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-dinamica"></tbody>
                </table>
            </div>
            <div class="hora-tabla">
                <h2>DIFERENCIA FIJA</h2>
                <table>
                    <thead>
                        <tr>
                            <th>País</th>
                            <th>Dif.</th>
                            <th>Validez / Nota</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-estatica"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/timezone-data.js"></script>
    <script>
        const timezoneData = [
            { code: "CL", name: "Chile", color: "#D32F2F", zone: "America/Santiago" },
            { code: "CO", name: "Colombia", color: "#FF9800", zone: "America/Bogota" },
            { code: "CR", name: "Costa Rica", color: "#4CAF50", zone: "America/Costa_Rica" },
            { code: "EC", name: "Ecuador", color: "#2196F3", zone: "America/Guayaquil" },
            { code: "SV", name: "El Salvador", color: "#9C27B0", zone: "America/El_Salvador" },
            { code: "GT", name: "Guatemala", color: "#00BCD4", zone: "America/Guatemala" },
            { code: "HN", name: "Honduras", color: "#FFC107", zone: "America/Tegucigalpa" },
            { code: "MX", name: "México", color: "#E91E63", zone: "America/Mexico_City" },
            { code: "NI", name: "Nicaragua", color: "#009688", zone: "America/Managua" },
            { code: "PA", name: "Panamá", color: "#607D8B", zone: "America/Panama" },
            { code: "PE", name: "Perú", color: "#FF5722", zone: "America/Lima" },
            { code: "US", name: "EE. UU. (Miami)", color: "#3F51B5", zone: "America/New_York" }
        ];

        const staticData = [
            { code: "CL", diff: "", periodo: "" },
            { code: "CO", diff: "0h", periodo: "país de referencia" },
            { code: "CR", diff: "-1h", periodo: "diferencia fija todo el año" },
            { code: "EC", diff: "0h", periodo: "continente; Galápagos -1h" },
            { code: "SV", diff: "-1h", periodo: "diferencia fija todo el año" },
            { code: "GT", diff: "-1h", periodo: "diferencia fija todo el año" },
            { code: "HN", diff: "-1h", periodo: "diferencia fija todo el año" },
            { code: "MX", diff: "-1h", periodo: "zona centro; sin cambio de horario" },
            { code: "NI", diff: "-1h", periodo: "diferencia fija todo el año" },
            { code: "PA", diff: "0h", periodo: "diferencia fija todo el año" },
            { code: "PE", diff: "0h", periodo: "diferencia fija todo el año" },
            { code: "US", diff: "", periodo: "" }
        ];

        function diffClass(diff) {
            if (diff.startsWith("+")) return "diff-mas";
            if (diff.startsWith("-")) return "diff-menos";
            return "diff-same";
        }

        function buildStatic() {
            const tbody = document.getElementById("tabla-estatica");
            const colObj = timezoneData.find(t => t.code === "CO");
            tbody.innerHTML = staticData.map(d => {
                const c = timezoneData.find(t => t.code === d.code);
                let diff = d.diff;
                let periodo = d.periodo;
                if (d.code === "CL") {
                    diff = formatDiff(getOffsetSeconds(c), getOffsetSeconds(colObj));
                    const dstActive = getOffsetSeconds(c) === -10800;
                    periodo = dstActive
                        ? "desde el 6 sep 2026 (horario de verano)"
                        : "hasta el 6 sep 2026; luego +2h (horario de verano)";
                }
                if (d.code === "US") {
                    diff = formatDiff(getOffsetSeconds(c), getOffsetSeconds(colObj));
                    const dstActive = getOffsetSeconds(c) === -14400;
                    periodo = dstActive
                        ? "hasta el 1 nov 2026; luego 0h (fin horario de verano)"
                        : "desde el 1 nov 2026 (fin horario de verano)";
                }
                return `<tr>
                    <td><span class="hora-dot" style="background:${c.color}"></span>${c.name}</td>
                    <td class="${diffClass(diff)}">${diff}</td>
                    <td class="nota">${periodo}</td>
                </tr>`;
            }).join("");
        }

        function getOffsetSeconds(country) {
            const rows = timeZoneDb[country.zone];
            const now = Math.floor(Date.now() / 1000);
            let offset = rows[0][1];
            for (const r of rows) {
                if (r[0] <= now) {
                    offset = r[1];
                } else {
                    break;
                }
            }
            return offset;
        }

        function formatDiff(cntSec, colSec) {
            const diffMin = (cntSec - colSec) / 60;
            if (diffMin === 0) return "0h";
            const sign = diffMin > 0 ? "+" : "-";
            const abs = Math.abs(diffMin);
            const h = Math.floor(abs / 60);
            const m = Math.round(abs % 60);
            const txt = (h ? h + "h" : "") + (m ? String(m).padStart(2, "0") + "m" : "");
            return sign + (txt || "0h");
        }

        function formatTime(country) {
            const offSec = getOffsetSeconds(country);
            const d = new Date(Date.now() + offSec * 1000);
            let h = d.getUTCHours();
            const ampm = h >= 12 ? "p.m." : "a.m.";
            h = h % 12; if (h === 0) h = 12;
            const mm = String(d.getUTCMinutes()).padStart(2, "0");
            const ss = String(d.getUTCSeconds()).padStart(2, "0");
            return `${h}:${mm}:${ss} ${ampm}`;
        }

        function formatUtc(country) {
            const offSec = getOffsetSeconds(country);
            const totalMin = Math.round(offSec / 60);
            const sign = totalMin < 0 ? "-" : "+";
            const abs = Math.abs(totalMin);
            const h = String(Math.floor(abs / 60)).padStart(2, "0");
            const m = String(abs % 60).padStart(2, "0");
            return "GMT" + sign + h + ":" + m;
        }

        function updateDynamic() {
            const tbody = document.getElementById("tabla-dinamica");
            const colSec = getOffsetSeconds(timezoneData.find(t => t.code === "CO"));
            tbody.innerHTML = timezoneData.map(t => {
                const cntSec = getOffsetSeconds(t);
                const diff = formatDiff(cntSec, colSec);
                return `<tr>
                    <td><span class="hora-dot" style="background:${t.color}"></span>${t.name}</td>
                    <td>
                        <span class="hora-ahora">${formatTime(t)}</span>
                        <span class="hora-utc">${formatUtc(t)}</span>
                    </td>
                    <td class="${diffClass(diff)}">${diff}</td>
                </tr>`;
            }).join("");
        }

        buildStatic();
        updateDynamic();
        setInterval(updateDynamic, 1000);
    </script>
</body>
</html>
