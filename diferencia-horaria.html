<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diferencia Horaria vs Colombia 2026</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="hora-container">
        <h1>DIFERENCIA HORARIA vs COLOMBIA</h1>
        <p class="hora-sub">Referencia: Colombia (UTC-5)</p>
        <div class="hora-volver">
            <a class="nav-link" href="index.html">&#9664; VOLVER AL CALENDARIO</a>
        </div>
        <div class="hora-grid">
            <div class="hora-tabla">
                <h2>HORA ACTUAL (EN VIVO)</h2>
                <table>
                    <thead>
                        <tr>
                            <th>País</th>
                            <th>Hora local</th>
                            <th>Dif.</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-dinamica"></tbody>
                </table>
            </div>
            <div class="hora-tabla">
                <h2>DIFERENCIA FIJA</h2>
                <table>
                    <thead>
                        <tr>
                            <th>País</th>
                            <th>Dif.</th>
                            <th>Validez / Nota</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-estatica"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const timezoneData = [
            { code: "CL", name: "Chile", color: "#D32F2F", tz: "America/Santiago" },
            { code: "CO", name: "Colombia", color: "#FF9800", tz: "America/Bogota" },
            { code: "CR", name: "Costa Rica", color: "#4CAF50", tz: "America/Costa_Rica" },
            { code: "EC", name: "Ecuador", color: "#2196F3", tz: "America/Guayaquil" },
            { code: "SV", name: "El Salvador", color: "#9C27B0", tz: "America/El_Salvador" },
            { code: "GT", name: "Guatemala", color: "#00BCD4", tz: "America/Guatemala" },
            { code: "HN", name: "Honduras", color: "#FFC107", tz: "America/Tegucigalpa" },
            { code: "MX", name: "México", color: "#E91E63", tz: "America/Mexico_City" },
            { code: "NI", name: "Nicaragua", color: "#009688", tz: "America/Managua" },
            { code: "PA", name: "Panamá", color: "#607D8B", tz: "America/Panama" },
            { code: "PE", name: "Perú", color: "#FF5722", tz: "America/Lima" }
        ];

        const staticData = [
            { code: "CL", diff: "+2h", periodo: "válido desde el 5 sep 2026 (horario de verano)" },
            { code: "CO", diff: "0h", periodo: "país de referencia" },
            { code: "CR", diff: "-1h", periodo: "diferencia fija todo el año" },
            { code: "EC", diff: "0h", periodo: "continente; Galápagos -1h" },
            { code: "SV", diff: "-1h", periodo: "diferencia fija todo el año" },
            { code: "GT", diff: "-1h", periodo: "diferencia fija todo el año" },
            { code: "HN", diff: "-1h", periodo: "diferencia fija todo el año" },
            { code: "MX", diff: "-1h", periodo: "zona centro; sin cambio de horario" },
            { code: "NI", diff: "-1h", periodo: "diferencia fija todo el año" },
            { code: "PA", diff: "0h", periodo: "diferencia fija todo el año" },
            { code: "PE", diff: "0h", periodo: "diferencia fija todo el año" }
        ];

        function diffClass(diff) {
            if (diff.startsWith("+")) return "diff-mas";
            if (diff.startsWith("-")) return "diff-menos";
            return "diff-same";
        }

        function buildStatic() {
            const tbody = document.getElementById("tabla-estatica");
            tbody.innerHTML = staticData.map(d => {
                const c = timezoneData.find(t => t.code === d.code);
                return `<tr>
                    <td><span class="hora-dot" style="background:${c.color}"></span>${c.name}</td>
                    <td class="${diffClass(d.diff)}">${d.diff}</td>
                    <td class="nota">${d.periodo}</td>
                </tr>`;
            }).join("");
        }

        function getOffsetMinutes(tz) {
            const dtf = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "longOffset" });
            const parts = dtf.formatToParts(new Date());
            const val = parts.find(p => p.type === "timeZoneName");
            if (!val) return 0;
            const m = val.value.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);
            if (!m) return 0;
            const sign = m[1] === "-" ? -1 : 1;
            return sign * (parseInt(m[2], 10) * 60 + (m[3] ? parseInt(m[3], 10) : 0));
        }

        function formatDiff(colMin, cntMin) {
            const diff = colMin - cntMin;
            if (diff === 0) return "0h";
            const abs = Math.abs(diff);
            const h = Math.floor(abs / 60);
            const m = abs % 60;
            const txt = (h ? h + "h" : "") + (m ? (m < 10 ? "0" : "") + m + "m" : "");
            return (diff > 0 ? "+" : "-") + (txt || "0h");
        }

        function formatTime(tz) {
            const now = new Date();
            return new Intl.DateTimeFormat("es-CO", {
                timeZone: tz,
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            }).format(now);
        }

        function formatUtc(tz) {
            const now = new Date();
            return new Intl.DateTimeFormat("en-US", {
                timeZone: tz,
                timeZoneName: "shortOffset"
            }).formatToParts(now).find(p => p.type === "timeZoneName").value;
        }

        function updateDynamic() {
            const tbody = document.getElementById("tabla-dinamica");
            const colMin = getOffsetMinutes("America/Bogota");
            tbody.innerHTML = timezoneData.map(t => {
                const cntMin = getOffsetMinutes(t.tz);
                const diff = formatDiff(cntMin, colMin);
                return `<tr>
                    <td><span class="hora-dot" style="background:${t.color}"></span>${t.name}</td>
                    <td>
                        <span class="hora-ahora">${formatTime(t.tz)}</span>
                        <span class="hora-utc">${formatUtc(t.tz)}</span>
                    </td>
                    <td class="${diffClass(diff)}">${diff}</td>
                </tr>`;
            }).join("");
        }

        buildStatic();
        updateDynamic();
        setInterval(updateDynamic, 1000);
    </script>
</body>
</html>
